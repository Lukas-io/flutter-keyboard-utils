// ❌ REMOVE the `package android` statement

group 'br.com.keyboard_utils'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.22' // Update to a stable version
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.3' // Update AGP
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ✅ Ensure plugins are applied correctly
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'br.com.keyboard_utils' // Required for AGP 8+
    compileSdkVersion 34 // Update to latest stable

    defaultConfig {
        minSdkVersion 21 // Update to meet modern standards
        targetSdkVersion 34 // Align with compileSdk
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}